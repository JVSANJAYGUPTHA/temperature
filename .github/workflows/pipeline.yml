name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install & Test
      run: |
        pip install -r requirements.txt
        pytest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: sanjayguptha
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push to Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: sanjayguptha/temperature:${{ github.sha }}

    - name: Start Local Kubernetes Cluster
      uses: medyagh/setup-minikube@master

    - name: Deploy to K8s
      run: |
        sed -i "s|sanjayguptha/temperature:IMAGE_TAG|sanjayguptha/temperature:${{ github.sha }}|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl rollout status deployment/temp-app-deployment
