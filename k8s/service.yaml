apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-app-deployment
  labels:
    app: temp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temp-app
  template:
    metadata:
      labels:
        app: temp-app
    spec:
      containers:
      - name: temp-app
        image: sanjayguptha/temperature:IMAGE_TAG
        ports:
        - containerPort: 5000
